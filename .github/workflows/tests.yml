name: tests
on: [push]
jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:

    - name: Set up Go 1.26
      uses: actions/setup-go@v5
      with:
        go-version: '1.26'
      id: go

    - name: Check out code into the Go module directory
      uses: actions/checkout@v4

    - name: Run tests
      run: go test ./...

    - name: Run tests (v2)
      working-directory: v2
      run: go test ./...
